[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "active-matter-publication"
version = "1.4.1"
description = "Publication rendering layer for ActiveMatter FinalEvaluation v0.4.0 outputs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.5", "tabulate>=0.9", "scikit-learn>=1.3"]

[project.scripts]
active-matter-publication = "ampub.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ampub*"]

[project.optional-dependencies]
dev = ["pytest>=8"]
