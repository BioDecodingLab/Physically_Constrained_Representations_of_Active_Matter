[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "active-matter-repr"
version = "0.2.0"
description = "Realizability-constrained multi-field representations and latent forecasts for active matter"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "h5py>=3.9,<4", "PyYAML>=6,<7", "matplotlib>=3.7,<4", "tqdm>=4.65,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
amrepr = "active_matter_repr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
